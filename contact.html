<body>
<h1><img src="http://farm2.static.flickr.com/1007/1480682798_8f84bb285d.jpg?v=0" hspace="20" border="2" align="left">Fulk Family Contacts </h1>
<form name="form1" method="post" action="cgi-bin/family.pl">
  <table width="200" border="0" cellspacing="4">
    <tr>
      <td>ID</td>
      <td><input name="ID" type="text" id="ID"> (put anything for ID 
that you can remember for later, like first initial, last name)</td>
    </tr>
    <tr>
      <td>First</td>
      <td><input name="First" type="text" id="First"></td>
    </tr>
    <tr>
      <td>Last</td>
      <td><input name="Last" type="text" id="Last"></td>
    </tr>
    <tr>
      <td>Address</td>
      <td><input name="Address" type="text" id="Addr"></td>
    </tr>
    <tr>
      <td>City</td>
      <td><input name="City" type="text" id="City"></td>
    </tr>
    <tr>
      <td>State</td>
      <td><input name="State" type="text" id="State"></td>
    </tr>
    <tr>
      <td>Zip</td>
      <td><input name="Zip" type="text" id="Zip"></td>
    </tr>
    <tr>
      <td>Country</td>
      <td><input name="Country" type="text" id="Country"></td>
    </tr>
    <tr>
      <td>Phone</td>
      <td><input name="Phone" type="text" id="Phone"></td>
    </tr>
    <tr>
      <td>Email</td>
      <td><input name="Email" type="text" id="Email"></td>
    </tr>
    <tr>
      <td>Blog</td>
      <td><input name="Blog" type="text" id="Blog"></td>
    </tr>
    <tr>
      <td>Photos</td>
      <td><input name="Photos" type="text" id="Photos"></td>
    </tr>
    <tr>
      <td>Other URL (facebook...) </td>
      <td><input name="URL" type="text" id="URL"></td>
    </tr>
  </table>
  <p>
    <input type="submit" name="Submit" value="Submit">
  </p>
</form>
<p><a href="cgi-bin/familyemails.pl">[Click here for email list]</a>\</p>
</body>
</html>
